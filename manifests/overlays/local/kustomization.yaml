apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Gateway API: hostname-based routing via *.localhost
  - path: patches/httproutes-hostnames.yaml
  - path: patches/keycloak-hostname.yaml
  # GatewayClass is cluster-scoped but Kustomize namespaces it (CRD, not in OpenAPI schema).
  # Strip the namespace so the Envoy Gateway controller can find it.
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: GatewayClass
      name: rpsd
    patch: |
      - op: remove
        path: /metadata/namespace
  # NodePort fallback (uncomment if not using Gateway API):
  # - path: patches/services-nodeport.yaml
