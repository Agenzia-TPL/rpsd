# Override KC_HOSTNAME for local Gateway API access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: "http://keycloak.localhost:19999"
