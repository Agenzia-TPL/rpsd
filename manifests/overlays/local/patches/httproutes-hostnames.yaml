# Override HTTPRoute hostnames for local development.
# Modern browsers resolve *.localhost to 127.0.0.1 natively (RFC 6761),
# so no /etc/hosts editing or external DNS services are needed.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rpsd-ingest-route
spec:
  hostnames:
    - "ingest.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rpsd-config-route
spec:
  hostnames:
    - "config.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
spec:
  hostnames:
    - "keycloak.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prefect-route
spec:
  hostnames:
    - "prefect.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui-route
spec:
  hostnames:
    - "kafka-ui.localhost"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq-route
spec:
  hostnames:
    - "rabbitmq.localhost"
