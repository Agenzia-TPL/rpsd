# Override KC_HOSTNAME for EKS Gateway API access.
# Replace "rpsd.example.com" with your actual domain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: "https://keycloak.rpsd.example.com"
