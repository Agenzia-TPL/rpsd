apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpsd-ingest
  labels:
    app.kubernetes.io/name: rpsd-ingest
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rpsd-ingest
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpsd-ingest
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: rpsd
    spec:
      containers:
        - name: rpsd-ingest
          image: ghcr.io/agenzia-tpl/rpsd-ingest:latest
          command: ["uv", "run", "server"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: PREFECT_API_URL
              value: http://prefect:4200/api
