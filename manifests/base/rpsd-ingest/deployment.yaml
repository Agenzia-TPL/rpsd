apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpsd-ingest
  labels:
    app.kubernetes.io/name: rpsd-ingest
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rpsd-ingest
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpsd-ingest
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: rpsd
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
        - name: wait-for-prefect
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z prefect 4200; do echo waiting for prefect; sleep 2; done"]
        - name: wait-for-rpsd-config
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rpsd-config 8000; do echo waiting for rpsd-config; sleep 2; done"]
      containers:
        - name: rpsd-ingest
          image: ghcr.io/agenzia-tpl/rpsd-ingest:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rpsd-ingest-env
          env:
            # Coordination overrides (take precedence over envFrom)
            - name: FORWARD__KAFKA__BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: FORWARD__RABBITMQ__URL
              value: amqp://guest:guest@rabbitmq/
            - name: CONSUMER__KAFKA__BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: CONSUMER__RABBITMQ__URL
              value: amqp://guest:guest@rabbitmq/
            - name: PREFECT_API_URL
              value: http://prefect:4200/api
