apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db
  labels:
    app.kubernetes.io/name: keycloak-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-db
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: rpsd
    spec:
      containers:
        - name: keycloak-db
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpsd-secrets
                  key: rpsd-keycloak-db-pass
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rpsd-keycloak-db-data
