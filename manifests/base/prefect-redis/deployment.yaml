apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-redis
  labels:
    app.kubernetes.io/name: prefect-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-redis
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: rpsd
    spec:
      containers:
        - name: prefect-redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rpsd-prefect-redis-data
