apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpsd-config
  labels:
    app.kubernetes.io/name: rpsd-config
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rpsd-config
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rpsd-config
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: rpsd
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z config-db 5432; do echo waiting for config-db; sleep 2; done"]
      containers:
        - name: rpsd-config
          image: ghcr.io/agenzia-tpl/rpsd-config:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rpsd-config-env
          env:
            # Coordination overrides (take precedence over envFrom)
            - name: DATABASES__default__HOST
              value: config-db
            - name: DATABASES__default__PORT
              value: "5432"
            - name: DATABASES__default__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpsd-secrets
                  key: rpsd-config-db-pass
            - name: KEYCLOAK_DISCOVERY_URL
              value: http://keycloak:8080/realms/rapsodia/.well-known/openid-configuration
