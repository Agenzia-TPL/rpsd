apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-db
  labels:
    app.kubernetes.io/name: config-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: rpsd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-db
      app.kubernetes.io/part-of: rpsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: rpsd
    spec:
      containers:
        - name: config-db
          image: ghcr.io/agenzia-tpl/rpsd-config-db:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: rpsd
            - name: POSTGRES_USER
              value: rpsd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rpsd-secrets
                  key: rpsd-config-db-pass
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-postgis.sql
              subPath: 01-postgis.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rpsd"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rpsd"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rpsd-config-db-data
        - name: init-sql
          configMap:
            name: config-db-init
