# repos.conf — Managed repository list for the rpsd platform
#
# Each line defines a managed repository:
#   NAME  TYPE  [DEPS]
#
# TYPE is one of:
#   service  — runnable Docker service (gets a compose profile)
#   library  — build dependency only (cloned, no compose profile)
#
# DEPS (optional) is a comma-separated list of library repos that the service
# depends on. Used by start-services.sh to detect when a library change
# requires rebuilding a service image.
#
# Git URLs are derived from rpsd's own remote origin.
# Lines starting with # are comments. Blank lines are ignored.
# Order matters: libraries should come before services that depend on them.

rpsd-commons    library
rpsd-ingest     service    rpsd-commons
rpsd-config     service
